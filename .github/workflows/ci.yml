name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the minimum in package.json engines. 24 is the current LTS line.
        node-version: ['20', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies without install scripts
        run: npm ci --ignore-scripts

      - name: Clean build
        run: npm run build

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Audit all dependencies
        run: npm audit

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Smoke-test the packed package
        run: bash scripts/smoke-pack.sh
